name: Build

# One push produces both editions (REBUILD_PLAN §6): a build-time matrix, not
# two repos. Deploy steps are intentionally left as TODOs until the Cloudflare
# Pages projects and tokens exist.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [in, ie]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static API + site (${{ matrix.edition }})
        env:
          EDITION: ${{ matrix.edition }}
          VITE_EDITION: ${{ matrix.edition }}
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.edition }}
          path: apps/web/build

      # TODO(deploy): wire cloudflare/pages-action once the two Pages projects
      # and CLOUDFLARE_API_TOKEN / account id secrets exist. One project per
      # edition; audio lives in R2, not in this bundle.

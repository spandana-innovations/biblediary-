name: Deploy preview to GitHub Pages

# Publishes preview/ to a gh-pages branch via a plain git push. This avoids the
# github-pages *environment* (whose default branch-protection blocks deploys
# from non-default branches). Pages then serves from the gh-pages branch.
on:
  push:
    branches: [claude/new-session-7dcvwk, main]
    paths:
      - "preview/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish preview/ to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp preview/index.html "$work/index.html"
          touch "$work/.nojekyll"      # skip Jekyll; serve files as-is
          cd "$work"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy preview ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
